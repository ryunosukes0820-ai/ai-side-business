<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | あなたの名前</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <p class="site-name">あなたの名前</p>
    <button class="menu-toggle" aria-label="メニューを開閉する" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav>
      <ul>
        <li><a href="index.html">トップ</a></li>
        <li><a href="works.html">実績・作品</a></li>
        <li><a href="contact.html">お問い合わせ</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section id="contact-intro">
      <h1>お問い合わせ</h1>
      <p>
        AI活用に関するご相談・お仕事のご依頼などは、以下のフォームからお気軽にご連絡ください。
      </p>
    </section>

    <section id="contact-form">
      <form action="https://formspree.io/f/xjybzrdy" method="POST">
        <input type="hidden" name="_subject" value="AI Side Businessサイトからのお問い合わせ">

        <div class="form-group">
          <label for="name">お名前</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="message">ご相談内容</label>
          <textarea id="message" name="message" rows="6" required></textarea>
        </div>

        <button type="submit" class="button">送信する</button>
      </form>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 あなたの名前</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
